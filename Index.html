<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BroTech Painting Quotation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .calculator {
      background: #ffffff;
      max-width: 750px;
      width: 100%;
      border-radius: 24px;
      padding: 28px 30px 30px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      border: 1px solid #cfdee9;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #1e3b5c;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    h1 span {
      background: #1e3b5c;
      color: white;
      font-size: 1.2rem;
      padding: 2px 12px;
      border-radius: 30px;
      font-weight: 400;
    }

    .subhead {
      color: #4a6f8c;
      margin-bottom: 28px;
      font-size: 0.95rem;
      border-left: 4px solid #1e3b5c;
      padding-left: 14px;
      font-weight: 400;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 22px;
      margin-bottom: 28px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 600;
      font-size: 0.85rem;
      color: #1e3b5c;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    input, select {
      padding: 12px 14px;
      border: 1.5px solid #ccddee;
      border-radius: 14px;
      font-size: 1rem;
      background: #fbfdff;
      transition: 0.15s;
      font-family: inherit;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #1e3b5c;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(30, 59, 92, 0.1);
    }

    /* improved checkbox row - now used for label + paint cost input */
    .paint-cost-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .paint-cost-row label {
      text-transform: none;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: normal;
      color: #1e3b5c;
      white-space: nowrap;
    }

    .paint-cost-row input {
      flex: 1;
      min-width: 140px;
      padding: 10px 14px;
      font-weight: 500;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 28px 0 24px;
    }

    button {
      padding: 14px 24px;
      border: none;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      flex: 1 1 auto;
      background: #e8f0f8;
      color: #1e3b5c;
      border: 1px solid #b8cee0;
    }

    button.primary {
      background: #1e3b5c;
      color: white;
      border: 1px solid #1e3b5c;
      box-shadow: 0 6px 12px rgba(30, 59, 92, 0.2);
    }

    button.primary:hover {
      background: #143049;
      border-color: #143049;
    }

    button:hover {
      background: #d9e6f2;
    }

    button.primary:hover {
      background: #143049;
    }

    .quote-panel {
      background: #eaf1f9;
      border-radius: 20px;
      padding: 22px 26px;
      border: 1px solid #c2d6e8;
      margin-top: 6px;
    }

    .quote-title {
      font-weight: 600;
      font-size: 1.1rem;
      color: #1e3b5c;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px dashed #a0bcd4;
      padding-bottom: 10px;
    }

    .quote-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      font-size: 1rem;
      color: #1f3e5c;
    }

    .quote-row.total {
      font-weight: 700;
      font-size: 1.3rem;
      border-top: 2px solid #1e3b5c;
      margin-top: 10px;
      padding-top: 14px;
      color: #0f2a40;
    }

    .quote-row .label {
      font-weight: 500;
    }

    .quote-row .value {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .muted-note {
      font-size: 0.8rem;
      color: #5a7c9c;
      margin-top: 14px;
      text-align: right;
      font-style: italic;
    }

    .empty-quote {
      color: #6f8da8;
      text-align: center;
      padding: 20px 0;
      font-style: italic;
    }

    .error-msg {
      font-size: 0.75rem;
      color: #b23b3b;
      margin-top: 3px;
      min-height: 16px;
    }

    input.invalid {
      border-color: #b23b3b;
      background: #fff6f6;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }
      .calculator {
        box-shadow: none;
        border: 1px solid #ccc;
        padding: 20px;
      }
      .button-group, .subhead, h1 span, .muted-note {
        display: none;
      }
      .quote-panel {
        border: 1px solid #aaa;
        background: #f9f9f9;
      }
      button {
        display: none;
      }
      input, select {
        border: none;
        background: transparent;
        padding-left: 0;
        font-weight: 600;
      }
    }
  </style>
</head>
<body>
  <div class="calculator">
    <h1>
      🎨 BroTech
      <span>Quote</span>
    </h1>
    <div class="subhead">Painting service estimator — offline & lightweight</div>

    <!-- input form -->
    <div class="form-grid">
      <div class="field full-width">
        <label for="customerName">Customer name</label>
        <input type="text" id="customerName" placeholder="e.g. John Doe" value="Walk-in customer">
        <div class="error-msg" id="nameError"></div>
      </div>

      <div class="field">
        <label for="serviceType">Service</label>
        <select id="serviceType">
          <option value="interior" selected>Interior painting</option>
          <option value="exterior">Exterior painting</option>
        </select>
      </div>

      <div class="field">
        <label for="areaSize">Area size (m²)</label>
        <input type="number" id="areaSize" min="1" step="1" value="50" placeholder="50">
        <div class="error-msg" id="areaError"></div>
      </div>

      <div class="field">
        <label for="numRooms">Number of rooms</label>
        <input type="number" id="numRooms" min="1" step="1" value="2" placeholder="2">
        <div class="error-msg" id="roomsError"></div>
      </div>

      <div class="field">
        <label for="travelDistance">Travel distance (km)</label>
        <input type="number" id="travelDistance" min="0" step="0.1" value="10" placeholder="10">
        <div class="error-msg" id="travelError"></div>
      </div>

      <!-- REPLACED: paint checkbox → paint cost text input -->
      <div class="field full-width">
        <div class="paint-cost-row">
          <label for="paintCost">🎨 Paint cost (R)</label>
          <input type="number" id="paintCost" min="0" step="0.01" value="500" placeholder="e.g. 500">
        </div>
        <div class="error-msg" id="paintError"></div>
        <div style="font-size:0.75rem; color:#5a7c9c; margin-top:4px;">Leave 0 if paint not included</div>
      </div>
    </div>

    <!-- buttons -->
    <div class="button-group">
      <button class="primary" id="calcBtn">🧮 Calculate Quote</button>
      <button id="clearBtn">🗑️ Clear</button>
      <button id="printBtn">🖨️ Print Quote</button>
    </div>

    <!-- quotation preview -->
    <div class="quote-panel" id="quotePanel">
      <div class="quote-title">
        <span>📋 Quotation preview</span>
        <span id="customerDisplay">Walk-in customer</span>
      </div>
      <div id="quoteContent">
        <div class="empty-quote">Click "Calculate Quote" to see estimate</div>
      </div>
      <div class="muted-note">BroTech painting – estimate only</div>
    </div>
  </div>

  <script>
    (function() {
      // ----- DOM elements -----
      const customerNameInput = document.getElementById('customerName');
      const serviceTypeSelect = document.getElementById('serviceType');
      const areaSizeInput = document.getElementById('areaSize');
      const numRoomsInput = document.getElementById('numRooms');
      const travelDistanceInput = document.getElementById('travelDistance');
      
      // REPLACED: now a text/number input for paint cost
      const paintCostInput = document.getElementById('paintCost');

      const calcBtn = document.getElementById('calcBtn');
      const clearBtn = document.getElementById('clearBtn');
      const printBtn = document.getElementById('printBtn');

      const quoteContent = document.getElementById('quoteContent');
      const customerDisplay = document.getElementById('customerDisplay');

      // error spans
      const nameError = document.getElementById('nameError');
      const areaError = document.getElementById('areaError');
      const roomsError = document.getElementById('roomsError');
      const travelError = document.getElementById('travelError');
      const paintError = document.getElementById('paintError');  // new

      // ----- helper: clear all error states -----
      function clearErrors() {
        [nameError, areaError, roomsError, travelError, paintError].forEach(el => el.textContent = '');
        [customerNameInput, areaSizeInput, numRoomsInput, travelDistanceInput, paintCostInput].forEach(el => el.classList.remove('invalid'));
      }

      // ----- validation (now validates paintCost >= 0) -----
      function validateForm() {
        clearErrors();
        let isValid = true;

        // customer name (at least 2 chars)
        const name = customerNameInput.value.trim();
        if (name.length < 2) {
          nameError.textContent = 'Enter customer name (min 2 characters)';
          customerNameInput.classList.add('invalid');
          isValid = false;
        }

        // area > 0
        const area = parseFloat(areaSizeInput.value);
        if (isNaN(area) || area <= 0) {
          areaError.textContent = 'Area must be greater than 0';
          areaSizeInput.classList.add('invalid');
          isValid = false;
        }

        // rooms >= 1
        const rooms = parseInt(numRoomsInput.value, 10);
        if (isNaN(rooms) || rooms < 1) {
          roomsError.textContent = 'At least 1 room required';
          numRoomsInput.classList.add('invalid');
          isValid = false;
        }

        // travel >= 0
        const travel = parseFloat(travelDistanceInput.value);
        if (isNaN(travel) || travel < 0) {
          travelError.textContent = 'Distance cannot be negative';
          travelDistanceInput.classList.add('invalid');
          isValid = false;
        }

        // paint cost >= 0 (allow 0)
        const paintCostVal = parseFloat(paintCostInput.value);
        if (isNaN(paintCostVal) || paintCostVal < 0) {
          paintError.textContent = 'Paint cost must be 0 or more';
          paintCostInput.classList.add('invalid');
          isValid = false;
        }

        return isValid;
      }

      // ----- calculation logic (uses paintCostInput value) -----
      function calculateQuote() {
        const service = serviceTypeSelect.value;          // 'interior' or 'exterior'
        const area = parseFloat(areaSizeInput.value);
        const rooms = parseInt(numRoomsInput.value, 10);
        const travelKm = parseFloat(travelDistanceInput.value);
        // read paint cost directly (0 = no paint)
        const paintCostValue = parseFloat(paintCostInput.value) || 0;
        const customerName = customerNameInput.value.trim() || 'Walk-in customer';

        // --- base labour: R600 for first 2 rooms, R250 for each extra room, plus area factor
        let baseLabour = service === 'interior' ? 600 : 750;

        // area surcharge: R6 per m² above 30 m² (interior) or R7 (exterior)
        const areaThreshold = 30;
        let areaSurcharge = 0;
        if (area > areaThreshold) {
          const extraArea = area - areaThreshold;
          const ratePerM2 = service === 'interior' ? 6 : 7;
          areaSurcharge = extraArea * ratePerM2;
        }

        // room surcharge: beyond 2 rooms, R250 per extra room
        let roomSurcharge = 0;
        if (rooms > 2) {
          roomSurcharge = (rooms - 2) * 250;
        }

        const labour = baseLabour + areaSurcharge + roomSurcharge;

        // --- travel cost: R10 per km, rounded to nearest rand
        const travelCost = Math.round(travelKm * 10);

        // --- paint cost: taken directly from input field (no base, just user-entered)
        const paintCost = paintCostValue;

        const total = labour + travelCost + paintCost;

        return {
          customerName,
          service: service === 'interior' ? 'Interior' : 'Exterior',
          area,
          rooms,
          travelKm,
          paintCostValue,      // raw paint cost value
          includePaint: paintCostValue > 0,  // just for display logic
          labour,
          travelCost,
          paintCost,
          total
        };
      }

      // ----- render quote with updated paint handling -----
      function renderQuote(data) {
        const {
          customerName,
          service,
          area,
          rooms,
          travelKm,
          paintCostValue,
          includePaint,        // derived: paintCostValue > 0
          labour,
          travelCost,
          paintCost,
          total
        } = data;

        customerDisplay.textContent = customerName;

        let html = '';

        html += `<div class="quote-row">
          <span class="label">Service</span>
          <span class="value">${service}</span>
        </div>`;

        html += `<div class="quote-row">
          <span class="label">Rooms / Area</span>
          <span class="value">${rooms} room(s) · ${area} m²</span>
        </div>`;

        html += `<div class="quote-row">
          <span class="label">Travel distance</span>
          <span class="value">${travelKm} km</span>
        </div>`;

        // Paint row: show paint cost value (if >0, show amount, else show "None")
        html += `<div class="quote-row">
          <span class="label">Paint cost</span>
          <span class="value">${paintCostValue > 0 ? 'R ' + paintCostValue.toFixed(2) : '—'}</span>
        </div>`;

        // breakdown lines
        html += `<div class="quote-row" style="margin-top:8px; border-top:1px dashed #a0bcd4; padding-top:12px;">
          <span class="label">Labour</span>
          <span class="value">R ${labour.toFixed(2)}</span>
        </div>`;

        html += `<div class="quote-row">
          <span class="label">Travel</span>
          <span class="value">R ${travelCost.toFixed(2)}</span>
        </div>`;

        // paint breakdown: if paint cost > 0, show it; else show dash
        if (paintCostValue > 0) {
          html += `<div class="quote-row">
            <span class="label">Paint (materials)</span>
            <span class="value">R ${paintCost.toFixed(2)}</span>
          </div>`;
        } else {
          html += `<div class="quote-row">
            <span class="label">Paint (materials)</span>
            <span class="value">—</span>
          </div>`;
        }

        html += `<div class="quote-row total">
          <span class="label">TOTAL</span>
          <span class="value">R ${total.toFixed(2)}</span>
        </div>`;

        quoteContent.innerHTML = html;
      }

      // ----- main handler -----
      function handleCalculate() {
        if (!validateForm()) {
          quoteContent.innerHTML = `<div class="empty-quote" style="color:#b23b3b;">⚠️ Please fix the errors above.</div>`;
          customerDisplay.textContent = '—';
          return;
        }
        const quoteData = calculateQuote();
        renderQuote(quoteData);
      }

      // ----- clear form (reset paint cost to 500) -----
      function handleClear() {
        customerNameInput.value = 'Walk-in customer';
        serviceTypeSelect.value = 'interior';
        areaSizeInput.value = 50;
        numRoomsInput.value = 2;
        travelDistanceInput.value = 10;
        paintCostInput.value = 500;    // default paint cost

        clearErrors();

        quoteContent.innerHTML = `<div class="empty-quote">Click "Calculate Quote" to see estimate</div>`;
        customerDisplay.textContent = 'Walk-in customer';
      }

      // ----- print (auto-calculate if needed) -----
      function handlePrint() {
        const hasQuote = quoteContent.querySelector('.quote-row') !== null;
        if (!hasQuote) {
          if (validateForm()) {
            const quoteData = calculateQuote();
            renderQuote(quoteData);
          } else {
            alert('Please fix the form errors before printing.');
            return;
          }
        }
        window.print();
      }

      // ----- attach event listeners -----
      calcBtn.addEventListener('click', handleCalculate);
      clearBtn.addEventListener('click', handleClear);
      printBtn.addEventListener('click', handlePrint);

      // enter key on inputs triggers calculate
      const inputs = [customerNameInput, areaSizeInput, numRoomsInput, travelDistanceInput, paintCostInput];
      inputs.forEach(input => {
        input.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            handleCalculate();
          }
        });
      });

      // ----- initialize with a calculated quote (paint cost default 500) -----
      window.addEventListener('DOMContentLoaded', () => {
        // ensure paint cost has default if empty (just in case)
        if (!paintCostInput.value || parseFloat(paintCostInput.value) < 0) {
          paintCostInput.value = 500;
        }
        if (validateForm()) {
          const initialData = calculateQuote();
          renderQuote(initialData);
        } else {
          quoteContent.innerHTML = `<div class="empty-quote">Click "Calculate Quote" to see estimate</div>`;
        }
      });
    })();
  </script>
</body>
</html>
